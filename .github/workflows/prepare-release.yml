name: Prepare release

on:
  workflow_dispatch:

permissions: {}

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require a maintainer on main
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.triggering_actor }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != 'refs/heads/main' ]; then
            echo "::error::Releases are prepared from main, not $REF"
            exit 1
          fi
          role=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .role_name)
          case "$role" in
            admin|maintain) echo "$ACTOR has role $role" ;;
            *) echo "::error::$ACTOR has role '$role'; preparing a release needs admin or maintain"; exit 1 ;;
          esac

  prepare:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - name: Create release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
          fetch-depth: 0
      - name: Setup Rust toolchain
        run: rustup toolchain install
      - name: Compute next version
        id: next
        run: |
          set -uo pipefail
          if version="$(bash scripts/next-version.sh)"; then rc=0; else rc=$?; fi
          if [ "$rc" -eq 0 ]; then
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 1 ]; then
            echo "::notice::Nothing release-worthy since the last tag -- skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::scripts/next-version.sh failed (exit ${rc})"
            exit "$rc"
          fi
      - name: Bump version
        if: steps.next.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: bash scripts/bump-version.sh "$VERSION"
      - name: Open release PR
        if: steps.next.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          branch="chore/bump-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump version -> ${VERSION}"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore: bump version -> ${VERSION}" \
            --body "Computed by prepare-release.yml from Conventional Commit subjects since the last tag (scripts/next-version.sh). Merging this releases v${VERSION}: release.yml tags the merge commit and publishes in the same run."
