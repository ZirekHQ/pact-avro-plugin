name: Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Build and Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        scala: [3.8.4]
        java: [zulu@17, zulu@21, zulu@25]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Ignore line ending differences in git
        if: contains(runner.os, 'windows')
        shell: bash
        run: git config --global core.autocrlf false

      - name: Configure pagefile for Windows
        if: contains(runner.os, 'windows')
        uses: al-cheb/configure-pagefile-action@v1.5
        with:
          minimum-size: 2GB
          maximum-size: 8GB
          disk-root: 'C:'

      - name: Checkout current branch (full)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java (zulu@17)
        if: matrix.java == 'zulu@17'
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17
          cache: sbt

      - name: Setup Java (zulu@21)
        if: matrix.java == 'zulu@21'
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
          cache: sbt

      - name: Setup Java (zulu@25)
        if: matrix.java == 'zulu@25'
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Check that workflows are up to date
        shell: bash
        run: sbt '++ ${{ matrix.scala }}; githubWorkflowCheck'

      - name: Set outputs
        id: vars
        shell: bash
        run: |
          echo "sha_short=$(git rev-parse --short ${{ github.sha }})" >> $GITHUB_OUTPUT
          echo "git_tag=$(git describe --tags)" >> $GITHUB_OUTPUT

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            modules/plugin-rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('modules/plugin-rs/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build and test Rust plugin
        if: matrix.java == 'zulu@17'
        shell: bash
        run: |
          cd modules/plugin-rs
          rustup toolchain install
          cargo fmt --check
          cargo build --locked --verbose
          cargo test --locked --verbose
          cargo clippy --locked --all-targets -- -D warnings

      - name: Start pact-broker
        if: runner.os == 'Linux'
        shell: bash
        run: docker compose up -d pact-broker

      - name: Wait for pact-broker
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9292/diagnostic/status/heartbeat > /dev/null; then
              echo "pact-broker is up"
              exit 0
            fi
            echo "waiting for pact-broker..."
            sleep 2
          done
          echo "pact-broker did not become ready in time" >&2
          exit 1

      
      - name: Install pact-broker CLI
        if: runner.os == 'Linux'
        uses: pactflow/actions@main

      - name: Build project
        shell: bash
        run: sbt '++ ${{ matrix.scala }}; compile; scalafmtCheckAll; javafmtCheckAll'

      - name: Install Rust plugin
        shell: bash
        run: |
          cd modules/plugin-rs
          cargo build --locked --release
          cd ../..
          bash scripts/pluginLocalInstall.sh

      - name: Test Consumer
        shell: bash
        run: sbt '++ ${{ matrix.scala }}; consumer/test'

      - name: Pact publish
        if: runner.os == 'Linux'
        env:
          PACT_BROKER_BASE_URL: 'http://localhost:9292'
        shell: bash
        run: pact-broker publish "modules/examples/consumer/target/pacts" --consumer-app-version=${{ steps.vars.outputs.git_tag }}-${{ runner.os }} --tag=${{ steps.vars.outputs.git_tag }}-${{ runner.os }} 

      - name: Test Provider
        if: runner.os == 'Linux'
        env:
          PACT_BROKER_BASE_URL: 'http://localhost:9292'
          PACT_BROKER_TAG: ${{ steps.vars.outputs.git_tag }}-${{ runner.os }}
        shell: bash
        run: sbt '++ ${{ matrix.scala }}; provider/test'

      - name: SonarCloud Scan
        if: runner.os == 'Linux' && matrix.java == 'zulu@17'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        uses: SonarSource/sonarqube-scan-action@v8
