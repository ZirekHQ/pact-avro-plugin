name: Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: [v*]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Build and Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        scala: [3.8.4]
        java: [zulu@17, zulu@21, zulu@25]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Ignore line ending differences in git
        if: contains(runner.os, 'windows')
        shell: bash
        run: git config --global core.autocrlf false

      - name: Configure pagefile for Windows
        if: contains(runner.os, 'windows')
        uses: al-cheb/configure-pagefile-action@v1.5
        with:
          minimum-size: 2GB
          maximum-size: 8GB
          disk-root: 'C:'

      - name: Checkout current branch (full)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java (zulu@17)
        if: matrix.java == 'zulu@17'
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17
          cache: sbt

      - name: Setup Java (zulu@21)
        if: matrix.java == 'zulu@21'
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
          cache: sbt

      - name: Setup Java (zulu@25)
        if: matrix.java == 'zulu@25'
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Check that workflows are up to date
        shell: bash
        run: sbt '++ ${{ matrix.scala }}; githubWorkflowCheck'

      - name: Set outputs
        id: vars
        shell: bash
        run: |
          echo "sha_short=$(git rev-parse --short ${{ github.sha }})" >> $GITHUB_OUTPUT
          echo "git_tag=$(git describe --tags)" >> $GITHUB_OUTPUT

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Build and test Rust plugin
        shell: bash
        run: |
          cd modules/plugin-rs
          cargo fmt --check
          cargo build --verbose
          cargo test --verbose
          cargo clippy --all-targets -- -D warnings

      - name: Start pact-broker
        if: runner.os == 'Linux'
        shell: bash
        run: docker compose up -d pact-broker

      - name: Wait for pact-broker
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9292/diagnostic/status/heartbeat > /dev/null; then
              echo "pact-broker is up"
              exit 0
            fi
            echo "waiting for pact-broker..."
            sleep 2
          done
          echo "pact-broker did not become ready in time" >&2
          exit 1

      
      - name: Install pact-broker CLI
        if: runner.os == 'Linux'
        uses: pactflow/actions@main

      - name: Build project
        shell: bash
        run: sbt '++ ${{ matrix.scala }}; compile; scalafmtCheckAll; javafmtCheckAll; coverage; plugin/test; plugin/coverageReport'

      - name: Test Consumer
        shell: bash
        run: sbt '++ ${{ matrix.scala }}; consumer/test'

      - name: Pact publish
        if: runner.os == 'Linux'
        env:
          PACT_BROKER_BASE_URL: 'http://localhost:9292'
        shell: bash
        run: pact-broker publish "modules/examples/consumer/target/pacts" --consumer-app-version=${{ steps.vars.outputs.git_tag }}-${{ runner.os }} --tag=${{ steps.vars.outputs.git_tag }}-${{ runner.os }} 

      - name: Test Provider
        if: runner.os == 'Linux'
        env:
          PACT_BROKER_BASE_URL: 'http://localhost:9292'
          PACT_BROKER_TAG: ${{ steps.vars.outputs.git_tag }}-${{ runner.os }}
        shell: bash
        run: sbt '++ ${{ matrix.scala }}; provider/test'

      - name: SonarCloud Scan
        if: runner.os == 'Linux' && matrix.java == 'zulu@17'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        uses: SonarSource/sonarqube-scan-action@v8

      - name: Compress target directories
        shell: bash
        run: tar cf targets.tar target modules/plugin/target modules/examples/provider/target modules/examples/consumer/target project/target

      - name: Upload target directories
        uses: actions/upload-artifact@v7
        with:
          name: target-${{ matrix.os }}-${{ matrix.scala }}-${{ matrix.java }}
          path: targets.tar

  publish:
    name: Publish Artifacts
    needs: [build]
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v'))
    strategy:
      matrix:
        os: [ubuntu-latest]
        scala: [3.8.4]
        java: [zulu@17]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Ignore line ending differences in git
        if: contains(runner.os, 'windows')
        run: git config --global core.autocrlf false

      - name: Configure pagefile for Windows
        if: contains(runner.os, 'windows')
        uses: al-cheb/configure-pagefile-action@v1.5
        with:
          minimum-size: 2GB
          maximum-size: 8GB
          disk-root: 'C:'

      - name: Checkout current branch (full)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java (zulu@17)
        if: matrix.java == 'zulu@17'
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17
          cache: sbt

      - name: Setup Java (zulu@21)
        if: matrix.java == 'zulu@21'
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
          cache: sbt

      - name: Setup Java (zulu@25)
        if: matrix.java == 'zulu@25'
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Download target directories (3.8.4)
        uses: actions/download-artifact@v8
        with:
          name: target-${{ matrix.os }}-3.8.4-${{ matrix.java }}

      - name: Inflate target directories (3.8.4)
        run: |
          tar xf targets.tar
          rm targets.tar

      - name: Doc - Install node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Doc - Install dependencies
        run: npm ci

      - name: Doc - build
        run: ./scripts/docBuild.sh ${{ github.ref }}

      - name: Build package
        run: 'sbt universal:packageZipTarball'

      - name: Prepare Artifacts
        run: ./scripts/prepArtifacts.sh

      - name: Upload Release Assets
        id: upload-release-asset
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/artifacts/*
          file_glob: true
          tag: ${{ github.ref }}

      - name: Publish docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sbt publishToGitHubPages
