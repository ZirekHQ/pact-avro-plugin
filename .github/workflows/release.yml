name: Release

on:
  push:
    branches: [main]
  # Manual runs are always dry runs; real releases come only from the push trigger.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'chore: bump version -> ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compute the release plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          version="$(awk '/^\[package\]/{f=1;next} /^\[/{f=0} f && /^version = /{gsub(/version = "|"/,""); print; exit}' Cargo.toml)"
          semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$version" =~ $semver_re ]]; then
            echo "::error::Cargo.toml version '${version}' is not an X.Y.Z version"
            exit 1
          fi
          release=true
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1 \
             || gh release view "v${version}" >/dev/null 2>&1; then
            release=false
          fi
          {
            echo "release=${release}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"
          {
            echo '### Release plan'
            echo "- version: ${version}"
            echo "- release: ${release}"
            echo "- dry run: ${DRY_RUN}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Nothing to release
        if: steps.plan.outputs.release != 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: echo "::notice::v${VERSION} is already released; merge a bump PR first (Prepare release)"

  preflight:
    name: Check release secrets
    needs: plan
    if: ${{ needs.plan.outputs.release == 'true' && needs.plan.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions: {}
    steps:
      - name: Require PACT_PLUGINS_PR_TOKEN
        env:
          PACT_PLUGINS_PR_TOKEN: ${{ secrets.PACT_PLUGINS_PR_TOKEN }}
        run: |
          if [ -z "$PACT_PLUGINS_PR_TOKEN" ]; then
            echo "::error::PACT_PLUGINS_PR_TOKEN is not set in the release environment; the pact-plugins index pull request cannot be opened"
            exit 1
          fi

  build:
    name: Build ${{ matrix.asset }}
    needs: [plan, preflight]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.release == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: true
      matrix:
        include:
          - { asset: linux-x86_64,   os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu }
          - { asset: linux-aarch64,  os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { asset: osx-x86_64,     os: macos-15-intel,   target: x86_64-apple-darwin }
          - { asset: osx-aarch64,    os: macos-15,         target: aarch64-apple-darwin }
          - { asset: windows-x86_64, os: windows-2025,     target: x86_64-pc-windows-msvc,  ext: .exe }
          - { asset: windows-aarch64, os: windows-11-arm,  target: aarch64-pc-windows-msvc, ext: .exe }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"
      - name: Verify binary version
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: test "$(target/$TARGET/release/pact-avro-plugin$EXT --version)" = "$VERSION"
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
          EXT: ${{ matrix.ext }}
        run: |
          mkdir dist
          name="pact-avro-plugin-${ASSET}${EXT}.gz"
          gzip -9 -c "target/$TARGET/release/pact-avro-plugin$EXT" > "dist/$name"
          (cd dist && openssl dgst -sha256 -r "$name" > "$name.sha256")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asset-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [plan, preflight, build]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: asset-*
          merge-multiple: true
          path: dist
      - name: Render manifest and install script
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: bash scripts/render-release-files.sh "$VERSION" dist all
      - name: Check the asset set
        run: |
          expected=(pact-plugin.json install-plugin.sh install-plugin.sh.sha256)
          for asset in linux-x86_64 linux-aarch64 osx-x86_64 osx-aarch64 windows-x86_64.exe windows-aarch64.exe; do
            expected+=("pact-avro-plugin-${asset}.gz" "pact-avro-plugin-${asset}.gz.sha256")
          done
          diff <(printf '%s\n' "${expected[@]}" | sort) <(cd dist && find . -type f -printf '%P\n' | sort)
      - name: Upload dry-run files
        if: ${{ needs.plan.outputs.dry_run == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: dist/*
      - name: Push release tag
        if: ${{ needs.plan.outputs.dry_run != 'true' }}
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "refs/tags/v${VERSION}"
      - name: Create release
        if: ${{ needs.plan.outputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: gh release create "v${VERSION}" dist/* --repo "$GITHUB_REPOSITORY" --title "v${VERSION}" --generate-notes --verify-tag

  smoke:
    name: Smoke test the published release
    needs: [plan, publish]
    if: ${{ needs.plan.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install and verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: bash scripts/smoke-install.sh "v${VERSION}"

  index-pr:
    name: Open the pact-plugins index pull request
    needs: [plan, smoke]
    if: ${{ needs.plan.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.PACT_PLUGINS_PR_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: bash scripts/index-pr.sh "v${VERSION}"

  # A release created with GITHUB_TOKEN does not fire `release` events, so dispatch from here.
  notify-docs:
    name: Notify docs site
    needs: [plan, publish]
    if: ${{ needs.plan.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch notify-docs
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: gh workflow run notify-docs.yml --repo "$GITHUB_REPOSITORY" -f "ref=v${VERSION}"
