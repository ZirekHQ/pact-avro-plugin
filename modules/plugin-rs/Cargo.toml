[package]
name = "pact-avro-plugin"
version = "0.1.0-dev"
edition = "2021"
publish = false

[[bin]]
name = "pact-avro-plugin"
path = "src/main.rs"

[dependencies]
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4"] }
md-5 = "0.10"
hex = "0.4"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"

[dev-dependencies]
pact_models = "1.3"
pact_matching = "2.0"

[build-dependencies]
tonic-prost-build = "0.14"
