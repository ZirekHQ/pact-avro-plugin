[package]
name = "pact-avro-plugin"
version = "0.1.0-dev"
edition = "2021"
publish = false

[[bin]]
name = "pact-avro-plugin"
path = "src/main.rs"

[dependencies]
apache-avro = "0.22"
bytes = "1"
hex = "0.4"
md-5 = "0.10"
pact_matching = "2.0"
pact_models = "1.3"
prost = "0.14"
prost-types = "0.14"
regex = "1"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.14"
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]

[build-dependencies]
tonic-prost-build = "0.14"
