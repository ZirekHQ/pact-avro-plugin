[package]
name = "pact-avro-plugin"
version = "0.1.0-dev"
edition = "2021"
publish = false

[[bin]]
name = "pact-avro-plugin"
path = "src/main.rs"

[dependencies]
apache-avro = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
md-5 = "0.11"
pact_matching = "2.0"
pact_models = "1.3"
pact-plugin-driver = { version = "1.2", default-features = false }
prost = "0.14"
prost-types = "0.14"
regex = "1"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["gzip"] }
tonic-prost = "0.14"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum = "0.8"
libc = "0.2"
pact_consumer = "1.4"
pact_verifier = "1.4"
